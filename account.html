<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي — iLogia</title><meta name="description" content="لوحة حسابك في iLogia"><meta name="theme-color" content="#136F58"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="css/style.css"><script>try{var t=localStorage.getItem("ilogia-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script></head><body><div id="top"></div><main class="wrap">
<div class="auth card" id="loginBox"><h1 style="font-size:1.6rem">تسجيل الدخول</h1><p class="muted">بنفس حسابك في موقع iLogia.</p>
  <form id="loginForm" style="display:grid;gap:14px">
    <label>البريد الإلكتروني<input type="email" id="email" autocomplete="username" required dir="ltr"></label>
    <label>كلمة السر<input type="password" id="password" autocomplete="current-password" required dir="ltr"></label>
    <div id="loginMsg"></div><button class="btn" id="loginBtn">دخول</button>
  </form>
  <p class="small muted" style="margin:16px 0 0;text-align:center">ليس لديك حساب؟ أنشئ حسابًا من <a href="https://ilogia-eg.com">موقع iLogia</a>.</p>
</div>
<div class="dash" id="dash" hidden><nav class="side" id="side" aria-label="أقسام الحساب"></nav><section id="view"></section></div>
</main>
<div id="foot"></div><script type="module" src="js/account.js"></script></body></html>
